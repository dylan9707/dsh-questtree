# quest-tree bundle patch: mounts the quest-tree plugin into the host
# composition of a dsh profile. The plugin registers its `quest_tree_*` tools
# into the shared `tools` registry and one usage section into the global
# system prompt, so every session of the profile can maintain a quest tree
# (main quest + branches) through natural language.
#
# Install: `dsh plugin --profile <name> add <path to this package>`
- insert:
    - id: quest-tree
      name: 'dsh-questtree'
      config:
        # Trees are keyed by session id under <stateRoot>/sessions/. Empty stateRoot
        # means ~/.dsh/storages/dsh-questtree, so a tree follows its session instead of
        # the working directory. stateDir/stateFile are only the pre-upgrade locations
        # read for migration.
        stateRoot: ''
        stateDir: .quest-tree
        stateFile: quest.json
