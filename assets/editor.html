<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任务树</title>
<style>
  :root {
    --qt-bg: #0b1d33;
    --qt-bg2: #10263f;
    --qt-line: #2a3d54;
    --qt-line-strong: #3d5370;
    --qt-text: #e6edf3;
    --qt-text2: #9fb3c8;
    --qt-text3: #62758a;
    --qt-accent: #4d9fff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--qt-bg);
    color: var(--qt-text);
    font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  #main-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; flex: none; }
  .head-title { color: var(--qt-text); font-size: 13px; font-weight: 600; }
  .head-stats { color: var(--qt-text3); font-size: 11px; margin-left: auto; }
  #crumb { display: flex; align-items: center; gap: 4px; padding: 5px 12px; border-bottom: 1px solid var(--qt-line); font-size: 11px; color: var(--qt-text2); overflow-x: auto; white-space: nowrap; flex: none; }
  .crumb-seg { flex: none; }
  .crumb-seg.cur { color: var(--qt-accent); font-weight: 600; }
  .crumb-sep { color: var(--qt-text3); flex: none; }
  #tree { flex: 1; overflow: auto; padding: 6px 0; }
  .node-row { display: flex; align-items: center; gap: 6px; padding: 4px 12px; min-height: 28px; }
  .node-row.here { background: color-mix(in srgb, var(--qt-accent) 14%, transparent); box-shadow: inset 2px 0 0 var(--qt-accent); }
  .node-exp { width: 14px; flex: none; color: var(--qt-text3); cursor: pointer; text-align: center; user-select: none; }
  .node-exp.empty { visibility: hidden; }
  .badge { display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; line-height: 18px; flex: none; }
  .st-todo { --st: #62758a; }
  .st-in_progress { --st: #4d9fff; }
  .st-closed { --st: #3fb950; }
  .st-decided { --st: #d29922; }
  .st-implemented { --st: #39c5cf; }
  .st-pending_decision { --st: #a371f7; }
  .st-blocked { --st: #f85149; }
  .badge { color: var(--st); border: 1px solid color-mix(in srgb, var(--st) 40%, transparent); background: color-mix(in srgb, var(--st) 12%, transparent); }
  .node-title { color: var(--qt-text); cursor: pointer; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node-title:hover { text-decoration: underline; }
  .node-progress { color: var(--qt-text3); font-size: 11px; flex: none; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .here-pill { background: var(--qt-accent); color: #fff; font-size: 10px; font-weight: 700; padding: 0 6px; border-radius: 999px; flex: none; line-height: 16px; }
  .empty { padding: 28px 16px; color: var(--qt-text3); text-align: center; font-size: 12px; }
  .node-detail { margin: 0 12px 6px; border-left: 2px solid var(--qt-line-strong); padding: 6px 10px; background: var(--qt-bg2); border-radius: 0 6px 6px 0; }
  .node-detail.st-decided { border-left-color: #d29922; }
  .node-detail.st-implemented { border-left-color: #39c5cf; }
  .node-detail.st-pending_decision { border-left-color: #a371f7; }
  .dt-sec + .dt-sec { margin-top: 8px; }
  .dt-h { color: var(--qt-text3); font-size: 11px; font-weight: 600; letter-spacing: .02em; }
  .dt-body { color: var(--qt-text); font-size: 12.5px; overflow: auto; max-height: 220px; }
  .dt-body h1, .dt-body h2, .dt-body h3, .dt-body h4 { font-size: 13px; margin: 8px 0 4px; }
  .dt-body p { margin: 4px 0; }
  .dt-body ul, .dt-body ol { margin: 4px 0; padding-left: 18px; }
  .dt-body code { background: var(--qt-line); padding: 1px 4px; border-radius: 4px; font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
  .dt-body pre { background: var(--qt-line); padding: 8px; border-radius: 6px; overflow: auto; }
  .dt-body pre code { background: transparent; padding: 0; }
  .dt-body a { color: var(--qt-accent); }
  .doc-pill { color: var(--qt-text3); border: 1px solid var(--qt-line); border-radius: 999px; font-size: 10px; line-height: 14px; padding: 0 5px; flex: none; }
  .doc-pill.btn { cursor: pointer; color: var(--qt-text2); border-color: var(--qt-line-strong); }
  .doc-pill.btn:hover { color: var(--qt-text); background: var(--qt-line); }
  .doc-pill.btn.open { color: var(--qt-text); border-color: color-mix(in srgb, var(--st, #4d9fff) 55%, transparent); }
  .head-btn { cursor: pointer; flex: none; color: var(--qt-text2); background: transparent; border: 1px solid var(--qt-line-strong); border-radius: 999px; font: inherit; font-size: 11px; line-height: 18px; padding: 0 9px; }
  .head-btn:hover { color: var(--qt-text); background: var(--qt-line); }
  .muted { color: var(--qt-text3); }
</style>
</head>
<body>
  <div id="main-head"></div>
  <div id="crumb"></div>
  <div id="tree"></div>
<script>
(function () {
  'use strict';
  var STATUS_LABEL = { todo: '待办', in_progress: '进行中', closed: '已闭', decided: '已拍·未实施', implemented: '已拍·已实施', pending_decision: '待拍', blocked: '阻塞' };
  var treeData = null;
  var expanded = new Set();
  // A node that already carries a decision or an implementation preview keeps its
  // "small window" open under the row; folding it is per node and survives polling.
  var detailCollapsed = new Set();
  var initialized = false;
  var inFlight = false;
  var lastJson = '';
  var sessionId = '';
  var cwd = '';
  try {
    var pageQuery = new URLSearchParams(window.location.search);
    sessionId = pageQuery.get('session') || '';
    cwd = pageQuery.get('cwd') || '';
  } catch (e) {}

  function syncTheme() {
    var map = {
      '--qt-bg': '--dsw-alias-bg-base',
      '--qt-bg2': '--dsw-alias-bg-layer-1',
      '--qt-line': '--dsw-alias-border-l1',
      '--qt-line-strong': '--dsw-alias-border-l2',
      '--qt-text': '--dsw-alias-label-primary',
      '--qt-text2': '--dsw-alias-label-secondary',
      '--qt-text3': '--dsw-alias-label-secondary',
      '--qt-accent': '--dsw-alias-brand-primary'
    };
    try {
      var cs = window.parent.getComputedStyle(window.parent.document.documentElement);
      var root = document.documentElement;
      for (var k in map) {
        var v = cs.getPropertyValue(map[k]).trim();
        if (v) root.style.setProperty(k, v);
      }
    } catch (e) {}
  }

  function naturalCompare(a, b) {
    return String(a).localeCompare(String(b), 'en', { numeric: true, sensitivity: 'base' });
  }

  function childrenOf(nodes, id) {
    return nodes.filter(function (n) { return n.parentId === id; })
      .sort(function (a, b) { return naturalCompare(a.id, b.id); });
  }

  function findNode(nodes, id) {
    for (var i = 0; i < nodes.length; i++) if (nodes[i].id === id) return nodes[i];
    return null;
  }

  function pathToCurrent(data) {
    var path = [];
    var cur = findNode(data.nodes, data.currentNodeId);
    var seen = {};
    while (cur && !seen[cur.id]) {
      seen[cur.id] = true;
      path.unshift(cur);
      cur = findNode(data.nodes, cur.parentId);
    }
    return path;
  }

  function initializeExpanded(data) {
    if (initialized) return;
    initialized = true;
    var root = null;
    for (var i = 0; i < data.nodes.length; i++) if (data.nodes[i].parentId === null) root = data.nodes[i];
    if (root) {
      expanded.add(root.id);
      var l1 = childrenOf(data.nodes, root.id);
      for (var j = 0; j < l1.length; j++) expanded.add(l1[j].id);
    }
    var path = pathToCurrent(data);
    for (var k = 0; k < path.length; k++) {
      if (childrenOf(data.nodes, path[k].id).length) expanded.add(path[k].id);
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function inlineMd(s) {
    var e = escapeHtml(s);
    e = e.replace(/\`([^\`]+)\`/g, '<code>$1</code>');
    e = e.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    e = e.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    e = e.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return e;
  }

  function mdToHtml(md) {
    if (!md) return '';
    var lines = String(md).replace(/\r\n?/g, '\n').split('\n');
    var out = [];
    var inCode = false;
    var codeBuf = [];
    var list = [];
    function flushList() {
      if (list.length) {
        out.push('<ul>' + list.map(function (li) { return '<li>' + li + '</li>'; }).join('') + '</ul>');
        list = [];
      }
    }
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (/^\`\`\`/.test(line)) {
        flushList();
        if (inCode) { out.push('<pre><code>' + escapeHtml(codeBuf.join('\n')) + '</code></pre>'); codeBuf = []; inCode = false; }
        else { inCode = true; }
        continue;
      }
      if (inCode) { codeBuf.push(line); continue; }
      if (/^\s*$/.test(line)) { flushList(); continue; }
      if (/^#{1,6}\s/.test(line)) {
        flushList();
        var m = line.match(/^(#{1,6})\s+(.*)$/);
        var level = m[1].length;
        out.push('<h' + level + '>' + inlineMd(m[2]) + '</h' + level + '>');
      } else if (/^\s*[-*+]\s+/.test(line)) {
        list.push(inlineMd(line.replace(/^\s*[-*+]\s+/, '')));
      } else if (/^\s*\d+\.\s+/.test(line)) {
        list.push(inlineMd(line.replace(/^\s*\d+\.\s+/, '')));
      } else {
        flushList();
        out.push('<p>' + inlineMd(line) + '</p>');
      }
    }
    flushList();
    if (inCode) out.push('<pre><code>' + escapeHtml(codeBuf.join('\n')) + '</code></pre>');
    return out.join('');
  }

  function buildNode(node, data, depth) {
    var kids = childrenOf(data.nodes, node.id);
    var isOpen = expanded.has(node.id);
    var wrap = document.createElement('div');
    var row = document.createElement('div');
    row.className = 'node-row' + (node.id === data.currentNodeId ? ' here' : '');
    row.style.paddingLeft = (8 + depth * 16) + 'px';

    var exp = document.createElement('span');
    exp.className = 'node-exp' + (kids.length ? '' : ' empty');
    if (kids.length) {
      exp.textContent = isOpen ? '▾' : '▸';
      (function (nid) {
        exp.addEventListener('click', function () { toggle(nid); });
      })(node.id);
    }
    row.appendChild(exp);

    var badge = document.createElement('span');
    badge.className = 'badge st-' + node.status;
    badge.textContent = STATUS_LABEL[node.status] || node.status;
    row.appendChild(badge);

    var t = document.createElement('span');
    t.className = 'node-title';
    t.textContent = node.title || node.id;
    t.title = detailIsOpen(node) ? '收起决策/实施记录' : '展开决策/实施记录';
    (function (n) {
      t.addEventListener('click', function () { toggleDetail(n.id); });
    })(node);
    row.appendChild(t);

    if (hasDocs(node)) {
      var openNow = detailIsOpen(node);
      var labels = [];
      if (node.decision) labels.push('决策');
      if (node.implementation) labels.push('实施');
      var pill = document.createElement('span');
      pill.className = 'doc-pill btn' + (openNow ? ' open' : '');
      pill.textContent = (openNow ? '▾ ' : '▸ ') + labels.join(' / ');
      pill.title = openNow ? '收起决策 / 实施记录' : '展开决策 / 实施记录';
      (function (n) {
        pill.addEventListener('click', function (ev) { ev.stopPropagation(); toggleDetail(n.id); });
      })(node);
      row.appendChild(pill);
    }

    if (node.id === data.currentNodeId) {
      var here = document.createElement('span');
      here.className = 'here-pill';
      here.textContent = '你在这';
      row.appendChild(here);
    }
    if (node.progress) {
      var prog = document.createElement('span');
      prog.className = 'node-progress';
      prog.textContent = node.progress;
      row.appendChild(prog);
    }
    wrap.appendChild(row);

    if (detailIsOpen(node)) wrap.appendChild(buildDetail(node));

    if (kids.length && isOpen) {
      var kidsWrap = document.createElement('div');
      for (var i = 0; i < kids.length; i++) {
        kidsWrap.appendChild(buildNode(kids[i], data, depth + 1));
      }
      wrap.appendChild(kidsWrap);
    }
    return wrap;
  }

  function toggle(id) {
    if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
    render();
  }

  // A node with a decision or implementation preview starts unfolded; folding one
  // node must not be undone by the next poll, so the folded set is kept in memory.
  function hasDocs(node) { return !!(node.decision || node.implementation); }

  function detailIsOpen(node) { return hasDocs(node) && !detailCollapsed.has(node.id); }

  function anyDocOpen(data) {
    for (var i = 0; i < data.nodes.length; i++) if (detailIsOpen(data.nodes[i])) return true;
    return false;
  }

  // A branch below the root that is currently unfolding children.
  function anyBranchOpen(data) {
    for (var i = 0; i < data.nodes.length; i++) {
      var n = data.nodes[i];
      if (n.parentId === null) continue;
      if (expanded.has(n.id) && childrenOf(data.nodes, n.id).length) return true;
    }
    return false;
  }

  // One gesture for a long interview: close every decision window and collapse every
  // branch below the root, so the panel drops back to the ten top-level rows.
  function foldAll(data) {
    var root = null;
    for (var i = 0; i < data.nodes.length; i++) {
      detailCollapsed.add(data.nodes[i].id);
      if (data.nodes[i].parentId === null) root = data.nodes[i];
    }
    expanded.clear();
    if (root) expanded.add(root.id);
    render();
  }

  function expandAll(data) {
    detailCollapsed.clear();
    expanded.clear();
    for (var i = 0; i < data.nodes.length; i++) {
      var n = data.nodes[i];
      if (childrenOf(data.nodes, n.id).length) expanded.add(n.id);
    }
    render();
  }

  function toggleDetail(id) {
    if (detailCollapsed.has(id)) detailCollapsed.delete(id); else detailCollapsed.add(id);
    render();
  }

  // Inline "small window" under a question row: what was decided, and — once the
  // code exists — the implementation preview that goes with it.
  function buildDetail(node) {
    var card = document.createElement('div');
    card.className = 'node-detail st-' + node.status;
    var secs = [
      { head: '决策', text: node.decision },
      { head: '实施 preview', text: node.implementation },
      { head: '备注', text: node.note }
    ];
    var shown = 0;
    for (var i = 0; i < secs.length; i++) {
      if (!secs[i].text) continue;
      shown++;
      var sec = document.createElement('div');
      sec.className = 'dt-sec';
      var h = document.createElement('div');
      h.className = 'dt-h';
      h.textContent = secs[i].head;
      var body = document.createElement('div');
      body.className = 'dt-body';
      body.innerHTML = mdToHtml(secs[i].text);
      sec.appendChild(h);
      sec.appendChild(body);
      card.appendChild(sec);
    }
    if (!shown) {
      var empty = document.createElement('div');
      empty.className = 'muted';
      empty.textContent = '尚无记录 —— 拍板后写决策，实施后补实施 preview';
      card.appendChild(empty);
    }
    return card;
  }

  function render() {
    var head = document.getElementById('main-head');
    var crumb = document.getElementById('crumb');
    var tree = document.getElementById('tree');
    var scrollTop = tree.scrollTop;
    head.innerHTML = '';
    crumb.innerHTML = '';
    tree.innerHTML = '';

    var data = treeData;
    if (!data || !Array.isArray(data.nodes) || data.nodes.length === 0) {
      var title = document.createElement('span');
      title.className = 'head-title';
      title.textContent = '任务树';
      head.appendChild(title);
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '暂无任务树 —— 让 agent 用 quest_tree_create 建一棵';
      tree.appendChild(empty);
      return;
    }

    var root = null;
    for (var ri = 0; ri < data.nodes.length; ri++) {
      if (data.nodes[ri].parentId === null) { root = data.nodes[ri]; break; }
    }
    var htitle = document.createElement('span');
    htitle.className = 'head-title';
    htitle.textContent = data.name || '任务树';
    head.appendChild(htitle);

    // Fold / unfold everything at once: decision windows and branches move together,
    // so "全部折叠" always leaves the same overview state.
    var canFold = anyDocOpen(data) || anyBranchOpen(data);
    var foldBtn = document.createElement('button');
    foldBtn.className = 'head-btn';
    foldBtn.textContent = canFold ? '全部折叠' : '全部展开';
    foldBtn.title = canFold ? '收起所有决策小窗与下级分支，只留顶层' : '展开所有分支与决策小窗';
    foldBtn.addEventListener('click', function () {
      if (canFold) foldAll(data); else expandAll(data);
    });
    head.appendChild(foldBtn);
    // Interview progress at a glance: how many questions still wait for a ruling,
    // how many are ruled but unbuilt, how many are built, how many are accepted.
    var counts = { pending_decision: 0, decided: 0, implemented: 0, closed: 0 };
    for (var i = 0; i < data.nodes.length; i++) {
      var st = data.nodes[i].status;
      if (counts[st] !== undefined) counts[st]++;
    }
    var parts = ['待拍 ' + counts.pending_decision];
    if (counts.decided) parts.push('已拍未实施 ' + counts.decided);
    if (counts.implemented) parts.push('已拍已实施 ' + counts.implemented);
    parts.push('已闭 ' + counts.closed + '/' + data.nodes.length);
    var stats = document.createElement('span');
    stats.className = 'head-stats';
    stats.textContent = parts.join(' · ');
    head.appendChild(stats);

    var path = pathToCurrent(data);
    for (var j = 0; j < path.length; j++) {
      var seg = document.createElement('span');
      seg.className = 'crumb-seg' + (j === path.length - 1 ? ' cur' : '');
      seg.textContent = path[j].title || path[j].id;
      crumb.appendChild(seg);
      if (j < path.length - 1) {
        var sep = document.createElement('span');
        sep.className = 'crumb-sep';
        sep.textContent = '/';
        crumb.appendChild(sep);
      }
    }

    if (root) {
      tree.appendChild(buildNode(root, data, 0));
    }
    tree.scrollTop = scrollTop;
  }

  function tick() {
    if (inFlight) return;
    inFlight = true;
    var query = [];
    if (sessionId) query.push('session=' + encodeURIComponent(sessionId));
    if (cwd) query.push('cwd=' + encodeURIComponent(cwd));
    var url = '/plugins/quest-tree/state' + (query.length ? '?' + query.join('&') : '');
    fetch(url, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); })
      .then(function (body) {
        treeData = body && Array.isArray(body.nodes) ? body : null;
        var j = JSON.stringify(treeData);
        if (j === lastJson) return;
        lastJson = j;
        if (treeData) initializeExpanded(treeData);
        render();
      })
      .catch(function () {})
      .then(function () { inFlight = false; });
  }

  syncTheme();
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
